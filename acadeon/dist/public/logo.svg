<svg width="260" height="64" viewBox="0 0 260 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="acadNavy" x1="6" y1="6" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E3A5F"/>
      <stop offset="100%" stop-color="#0F2438"/>
    </linearGradient>
    <linearGradient id="acadEmerald" x1="16" y1="12" x2="38" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="acadGold" x1="20" y1="10" x2="32" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="shadow" x="2" y="2" width="54" height="54" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F2438" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- Icon Container with subtle rounded squircle -->
  <g transform="translate(6, 6)" filter="url(#shadow)">
    <!-- Squircle base -->
    <rect x="0" y="0" width="52" height="52" rx="14" fill="url(#acadNavy)"/>
    <rect x="0.5" y="0.5" width="51" height="51" rx="13.5" stroke="#FFFFFF" stroke-opacity="0.12"/>
    
    <!-- Open Book / Pages Base (Savoir & Recherche) -->
    <path d="M14 36.5 C19 33.5 25 34.5 26 36 C27 34.5 33 33.5 38 36.5" 
          stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M15 40 C19.5 37.5 25 38.5 26 39.5 C27 38.5 32.5 37.5 37 40" 
          stroke="url(#acadEmerald)" stroke-width="2" stroke-linecap="round" stroke-opacity="0.9"/>
    
    <!-- Architectural Stylized "A" (Acadéon, Ascension) -->
    <path d="M17 33 L26 14 L35 33" 
          stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Mortarboard / Graduation Cap Bar (Soutenance & Réussite) -->
    <path d="M18.5 25 L26 21 L33.5 25 L26 29 Z" 
          fill="url(#acadEmerald)" fill-opacity="0.95" stroke="#FFFFFF" stroke-width="1.2" stroke-linejoin="round"/>
    
    <!-- Guiding Star / Academic Beacon (Plafond de l'excellence) -->
    <polygon points="26,9.5 27.6,13 31,13.5 28.5,15.8 29.2,19 26,17.2 22.8,19 23.5,15.8 21,13.5 24.4,13" 
             fill="url(#acadGold)"/>
  </g>

  <!-- Typography -->
  <text x="74" y="38" fill="#0F2438" font-family="Manrope, DM Sans, sans-serif" font-size="28" font-weight="800" letter-spacing="-1.5">Acadéon</text>
  <circle cx="206" cy="36" r="3.5" fill="#10B981"/>
  
  <!-- Subtitle Tagline -->
  <text x="75" y="50" fill="#64748B" font-family="Manrope, DM Sans, sans-serif" font-size="7.5" font-weight="700" letter-spacing="2.4">ASSISTANT ACADÉMIQUE</text>
</svg>
