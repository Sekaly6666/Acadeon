kind = "web"
previewPath = "/"
title = "Acadéon"
description = "Acadéon aide les étudiants francophones de Côte d’Ivoire à cadrer un sujet académique, structurer leur projet, rédiger avec méthode et se préparer à la soutenance. Application mobile-first avec parcours guidé, projets sauvegardés et entraînement au jury."
version = "1.0.0"
id = "artifacts/acadeon"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19908

[services.development]
run = "pnpm --filter @workspace/acadeon run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/acadeon", "run", "build" ]
serve = "static"
publicDir = "artifacts/acadeon/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19908"
BASE_PATH = "/"
